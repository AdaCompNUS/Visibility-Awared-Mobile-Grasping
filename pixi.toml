# pixi environment for Visibility-Awared Mobile Grasping (ManiSkill simulation path).
#
# Goal: `pixi install` sets up the whole environment — Python + ML stack, ROS Noetic
# (imported at module load by the robot code), the GPU/Vulkan libs, AND compiles the
# three C/C++ modules the robot needs:
#   - pytracik   (third_party/pytracik)  ROS-free TRAC-IK, pybind11 + CMake
#   - vamp       (third_party/vamp)       whole-body motion planner, scikit-build + CMake
#   - ikfast_fetch (this package)         analytic IK C++ extension (setuptools)
# The two CMake modules are built by scikit-build-core, which pulls cmake+ninja from
# PyPI (the "pip cmake"); their C/C++ deps (orocos-kdl, nlopt, eigen, boost) come from
# this conda env. Real-robot / Gazebo paths are out of scope here.
#
# Manage this env ONLY through pixi (never system pip/conda).

[workspace]
name = "mobile_grasping_in_dynamic"
version = "1.0.0"
description = "Visibility-Aware Mobile Grasping — pixi env (ManiSkill + ROS Noetic + torch cu124)"
channels = ["conda-forge", "robostack-noetic"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# conda dependencies: python, ROS Noetic, C/C++ build toolchain, GPU/Vulkan libs
# ---------------------------------------------------------------------------
[dependencies]
python = "3.11.*"
pip = "*"
setuptools = "*"
wheel = "*"

# numpy MUST stay < 2 (RoboStack cv_bridge / tf C-ABI).
numpy = ">=1.26.4,<2"

# newest libstdc++/libgcc so SAPIEN/torch manylinux_2_28 wheels load cleanly
libstdcxx-ng = ">=13"
libgcc-ng = ">=13"

# cv2 for the perception code (conda build; do NOT also pip-install opencv-python).
opencv = "*"

# ---- ROS Noetic (RoboStack) — imported at module load via grasp_anywhere.robot.fetch ----
"ros-noetic-rospy" = "*"
"ros-noetic-tf" = "*"
"ros-noetic-tf2-ros" = "*"
"ros-noetic-actionlib" = "*"
"ros-noetic-cv-bridge" = "*"
"ros-noetic-sensor-msgs" = "*"
"ros-noetic-std-msgs" = "*"
"ros-noetic-geometry-msgs" = "*"
"ros-noetic-nav-msgs" = "*"
"ros-noetic-move-base-msgs" = "*"
"ros-noetic-trajectory-msgs" = "*"
"ros-noetic-control-msgs" = "*"
rospkg = "*"

# ---- C/C++ build toolchain for pytracik (pybind11/CMake) + vamp + ikfast ----
cxx-compiler = "*"
c-compiler = "*"
cmake = ">=3.20"
make = "*"
ninja = "*"
pkg-config = "*"
pybind11 = "*"
eigen = "*"
libboost-devel = "*"
orocos-kdl = "*"
nlopt = "*"

# ---- GPU rendering (SAPIEN uses Vulkan; NVIDIA ICD comes from the host driver) ----
vulkan-tools = "*"
libgl-devel = "*"

# ---------------------------------------------------------------------------
# PyPI dependencies. torch cu124 is pinned to its index so mani_skill/sapien do
# not re-pull a CPU torch. pytracik / vamp build from the vendored source with the
# pip cmake; the editable project build compiles ikfast_fetch against this env.
# ---------------------------------------------------------------------------
[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]
# Build the project without isolation so ikfast_fetch compiles against this env's
# toolchain (and its declared deps are not re-resolved from scratch). pytracik and
# vamp keep isolation so their CMake build uses the pip cmake, as intended.
no-build-isolation = ["mobile_grasping_in_dynamic"]

[pypi-dependencies]
torch = { version = "==2.4.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = "==0.19.1", index = "https://download.pytorch.org/whl/cu124" }
mani_skill = "*"
pytorch-kinematics = "*"
small-gicp = "*"
open3d = "*"
pyrender = "*"
trimesh = "*"
transformers = "*"
flask = "*"
requests = "*"
rich = "*"
h5py = "*"
scipy = "*"
Pillow = "*"
pyyaml = "*"
gymnasium = "*"
tqdm = "*"
scikit-learn = "*"
openai = "*"
pydub = "*"

# The vendored C/C++ modules — compiled on `pixi install` (CMake via the pip cmake).
pytracik = { path = "third_party/pytracik" }
vamp = { path = "third_party/vamp" }
# The project itself (editable) — compiles the ikfast_fetch C++ extension.
mobile_grasping_in_dynamic = { path = ".", editable = true }

# ---------------------------------------------------------------------------
[activation.env]
UV_HTTP_TIMEOUT = "600"
# CMake finds the conda C/C++ deps (orocos-kdl, nlopt, eigen) via this prefix even
# inside scikit-build-core's isolated build.
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig"
# Force the host NVIDIA Vulkan ICD (conda's loader may not auto-find it).
VK_ICD_FILENAMES = "/usr/share/vulkan/icd.d/nvidia_icd.json"
# ManiSkill appends `/data` to this root internally. Pointing this at the data
# directory itself would resolve assets under `~/.maniskill/data/data`.
MS_ASSET_DIR = "$HOME/.maniskill"
MS_SKIP_ASSET_DOWNLOAD_PROMPT = "1"

# ---------------------------------------------------------------------------
[tasks]
# Download the ManiSkill assets the example scenes need.
download-assets = "python -m mani_skill.utils.download_asset -y ReplicaCAD && python -m mani_skill.utils.download_asset -y ycb"
# The ManiSkill benchmark entry point (needs assets + the grasp service on :4003).
run-benchmark = "python experiments/run_maniskill_benchmark.py --config grasp_anywhere/configs/maniskill_fetch.yaml --benchmark resources/grasp_benchmark.json"
# ROS master for the interactive RoboMesh demo.
roscore = "roscore"
# The interactive RoboMesh demo node (click-to-grasp + chat views). See
# experiments/robomesh/README.md for the full local/browser setup.
robomesh = "python experiments/robomesh/maniskill_robomesh_node.py"

# ---------------------------------------------------------------------------
# `rl` sub-environment — MS-HAB learning baseline (see baseline/RL/).
#
# Isolated from the default env on purpose: MS-HAB requires the `mshab` BRANCH
# of ManiSkill3 (a frozen beta snapshot, not on PyPI), while the default env
# pins the released mani_skill 3.0.1. Both provide the same package, so they
# cannot share one solve. Exact upstream commits are pinned below; nothing in
# either upstream tree is modified.
#   Use:  pixi run -e rl <cmd>       (env dir: .pixi/envs/rl)
# ---------------------------------------------------------------------------
[feature.rl.dependencies]
python = "3.11.*"
pip = "*"
setuptools = "<81"  # sapien 3.0.0b1 imports pkg_resources (removed in setuptools 81)
wheel = "*"
libstdcxx-ng = ">=13"
libgcc-ng = ">=13"
vulkan-tools = "*"
libgl-devel = "*"

[feature.rl.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]

[feature.rl.pypi-dependencies]
# Same torch/CUDA stack as the default env (proven on this machine's driver).
# torch 2.4 also predates the 2.6 `weights_only` default flip, so MS-HAB's
# checkpoint loading behaves as it did when they trained.
torch = { version = "==2.4.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = "==0.19.1", index = "https://download.pytorch.org/whl/cu124" }
numpy = "<2"
# ManiSkill3 @ `mshab` branch tip — the snapshot MS-HAB (and SG-VLA) trained on.
mani_skill = { git = "https://github.com/haosulab/ManiSkill.git", rev = "17121e3f96e3ee3ed0c03610b17f8bc2864617af" }
# MS-HAB itself, unmodified, with training extras (omegaconf, wandb, tensorboard, ...).
mshab = { git = "https://github.com/arth-shukla/mshab.git", rev = "e9ff3d23496d38e4431c8d913e147ffa007f7f72", extras = ["train"] }

[feature.rl.activation.env]
# Separate asset tree: MS-HAB's ReplicaCAD re-download DELETES the target
# scene-dataset directory, which must never touch the main project's assets.
MS_ASSET_DIR = "$PIXI_PROJECT_ROOT/baseline/RL/assets"
SAPIEN_NO_DISPLAY = "1"

[feature.rl.tasks]
rl-smoke = { cmd = "python -c \"import mani_skill, mshab.envs, torch; print('mani_skill', mani_skill.__version__); print('torch', torch.__version__, 'cuda', torch.cuda.is_available())\"", cwd = "baseline/RL" }
rl-download-assets = { cmd = "python -m mani_skill.utils.download_asset -y ycb && python -m mani_skill.utils.download_asset -y ReplicaCAD && python -m mani_skill.utils.download_asset -y ReplicaCADRearrange", cwd = "baseline/RL" }
rl-train = { cmd = "bash train.sh", cwd = "baseline/RL" }


# ---------------------------------------------------------------------------
# `vla` sub-environment — SG-VLA-style baseline (see baseline/VLA/).
# Training (torch + transformers) AND benchmark evaluation (mani_skill 3.0.1,
# the same released simulator version as the default env, so VLA results are
# measured by the identical referee as all other rows).
# ---------------------------------------------------------------------------
[feature.vla.dependencies]
python = "3.11.*"
pip = "*"
setuptools = "<81"  # sapien imports pkg_resources
wheel = "*"
libstdcxx-ng = ">=13"
libgcc-ng = ">=13"
vulkan-tools = "*"
libgl-devel = "*"

[feature.vla.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]

[feature.vla.pypi-dependencies]
torch = { version = "==2.4.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = "==0.19.1", index = "https://download.pytorch.org/whl/cu124" }
numpy = "<2"
mani_skill = "==3.0.1"
transformers = ">=4.46,<4.50"
accelerate = "*"
h5py = "*"
scipy = "*"
einops = "*"
safetensors = "*"
tensorboard = "*"
pillow = "*"
opencv-python-headless = "*"

[feature.vla.activation.env]
HF_HOME = "$PIXI_PROJECT_ROOT/baseline/VLA/hf_cache"
SAPIEN_NO_DISPLAY = "1"
# PCIe P2P hangs NCCL's first collective on this host (no NVLink; FSDP
# all-gather wedged 10 min on all ranks). SHM transport costs ~13%/step.
NCCL_P2P_DISABLE = "1"

[environments]
rl = { features = ["rl"], no-default-feature = true }
vla = { features = ["vla"], no-default-feature = true }
